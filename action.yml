name: tfmodlint
description: Lint Terraform modules and annotate problems on the pull request diff.
inputs:
  path:
    description: Directory to lint. Every module under it is checked.
    default: "."
  args:
    description: Extra arguments, for example `--strict --disable naming`.
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - shell: bash
      run: python -m pip install --quiet "$GITHUB_ACTION_PATH"
    - shell: bash
      env:
        LINT_PATH: ${{ inputs.path }}
        ARGS: ${{ inputs.args }}
      # ARGS is split on spaces on purpose.
      run: tfmodlint --recursive --format github $ARGS "$LINT_PATH"
