[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tfmodlint"
version = "0.1.0"
description = "Lint Terraform modules for the problems that make them hard to reuse"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "python-hcl2>=8,<9",
]

[project.scripts]
tfmodlint = "tfmodlint.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
